# SH7 real run: FrontierScience via locally-served DeepSeek-R1-Distill-Qwen-32B.
#
# Launch the server first (single-node, two GPUs):
#   vllm serve deepseek-ai/DeepSeek-R1-Distill-Qwen-32B \
#     --reasoning-parser deepseek_r1 \
#     --tensor-parallel-size 2 \
#     --port 8000 --max-model-len 16384
#
# Then run scripts/01_traces.py … 05_analyze_failure_modes.py with
# --config pointing at this file.

paths:
  data_dir: ../../data/sh6
  reports_dir: reports

dataset:
  name: frontierscience
  hf_path: openai/frontierscience
  split: test
  max_samples: null

traces:
  model:
    name: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
    base_url: http://localhost:8000/v1
    api_key_env: LOCAL_LLM_API_KEY
    backend: local
    reasoning:
      enabled: true
    extra_body:
      temperature: 0.6
      top_p: 0.95
      # max_tokens must leave room for the prompt within --max-model-len 16384.
      # FrontierScience problems are <2k tokens; 12288 gives the model ample
      # reasoning budget while keeping a 4k headroom for prompt + system.
      max_tokens: 12288
  max_concurrent: 8
  max_retries: 3
  retry_min_wait: 1.0
  retry_max_wait: 60.0

grader:
  # Non-reasoning judge served on port 8001. Same rationale as the pilot
  # config: reasoning distills aren't reliable JSON emitters under a
  # token budget. For the real run, the R1-Distill-32B claims both GPUs
  # via tensor-parallel, so the judge is run sequentially: stop the
  # 32B server after stage 1 (traces), launch the judge, then run
  # stages 2+ + grading.
  model:
    name: Qwen/Qwen3-30B-A3B-Instruct-2507
    base_url: http://localhost:8001/v1
    api_key_env: LOCAL_LLM_API_KEY
    backend: local
    reasoning:
      enabled: false
    extra_body:
      temperature: 0.0
      max_tokens: 1024
  max_concurrent: 8

pairwise_slod:
  model:
    name: Qwen/Qwen3-30B-A3B-Instruct-2507
    base_url: http://localhost:8001/v1
    api_key_env: LOCAL_LLM_API_KEY
    backend: local
    reasoning:
      enabled: false
    extra_body:
      temperature: 0.0
      max_tokens: 256
  max_concurrent: 8
  extra_comparisons_per_problem: 10
  min_chunks: 2

failure_analysis:
  target_label: auto
  interp_points: 20
  cv_folds: 5
  random_state: 42
  top_k_features: 12
