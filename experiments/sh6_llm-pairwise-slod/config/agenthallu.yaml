paths:
  data_dir: ../../../data/sh6
  reports_dir: ../reports

dataset:
  name: agenthallu
  # On first run the loader clones this repo into
  # {data_dir}/_sources/agenthallu-{repo_ref}. Set `local_path` to point at
  # an existing checkout (directory containing AgentHallu/<framework>/*.json)
  # to skip the clone.
  repo_url: https://github.com/liuxuannan/AgentHallu.git
  repo_ref: main
  local_path: null
  # Restrict to specific agent frameworks. "all" or null loads every framework.
  # Known: BFCL, Camel, Magentic_One, Octotools, OpenDeepSearch, OpenManus, SmolAgents
  frameworks: all
  # Optional filter on question_domain. "all" or null keeps every domain.
  # Known: "Math", "Science", "Tool Use", "World Knowledge", "General Assistant"
  domains: all
  # Optional filter on backbone model_id.
  models: all
  max_samples: null

agenthallu_eval:
  enabled: true
  # Matches the benchmark paper/reference implementation:
  # - all_at_once: one judgment + attribution call over the full trajectory
  # - step_by_step: inspect prefixes until the first hallucinated step is found
  method: all_at_once
  model:
    name: deepseek/deepseek-v3.2
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    reasoning:
      enabled: false
    extra_body:
      temperature: 0.0
      max_tokens: 2048
  max_concurrent: 20
  max_retries: 5
  retry_min_wait: 1.0
  retry_max_wait: 60.0
  geval:
    enabled: false
    # The paper reports explanation quality with GPT-5 as evaluator.
    # Enable this block to reproduce that metric in SH6.
    model:
      name: gpt-5-2025-08-07
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      reasoning:
        enabled: false
      extra_body:
        max_tokens: 256
    max_concurrent: 20
    max_retries: 5
    retry_min_wait: 1.0
    retry_max_wait: 60.0

pairwise_slod:
  model:
    name: deepseek/deepseek-v3.2
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    reasoning:
      enabled: false
    extra_body:
      max_tokens: 65536
  max_concurrent: 40
  extra_comparisons_per_problem: 20
  min_chunks: 2

failure_analysis:
  target_label: auto
  interp_points: 20
  cv_folds: 5
  random_state: 42
  top_k_features: 12

failure_attribution:
  cv_folds: 5
  random_state: 42
  # Drop failure-type classes with fewer than this many samples before fitting
  # the multi-class classifier. AgentHallu has fine-grained categories that
  # would otherwise overwhelm small folds.
  min_class_count: 5
