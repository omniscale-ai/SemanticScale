# SH7 pilot: FrontierScience via locally-served DeepSeek-R1-Distill-Qwen-1.5B.
#
# Launch the server first:
#   vllm serve deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B \
#     --reasoning-parser deepseek_r1 --port 8000 --max-model-len 16384
#
# Then run scripts/01_traces.py … 05_analyze_failure_modes.py with
# --config pointing at this file. Smoke-tests the local pipeline on 20
# problems; promote to the 32B config for the real run.

paths:
  data_dir: ../../data/sh6
  reports_dir: reports

dataset:
  name: frontierscience
  hf_path: openai/frontierscience
  split: test
  max_samples: 20

traces:
  model:
    name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    base_url: http://localhost:8000/v1
    api_key_env: LOCAL_LLM_API_KEY
    backend: local
    reasoning:
      enabled: true
    extra_body:
      temperature: 0.6
      top_p: 0.95
      max_tokens: 8192
  max_concurrent: 8
  max_retries: 3
  retry_min_wait: 1.0
  retry_max_wait: 30.0

grader:
  # Non-reasoning judge served on port 8001. Reasoning distills can't
  # reliably close <think> in budget, so they're a poor fit for deterministic
  # JSON-schema grading. Qwen3-30B-A3B-Instruct-2507 is non-thinking SOTA
  # (MoE, 3B active) — fast, deterministic, strong at JSON output.
  model:
    name: Qwen/Qwen3-30B-A3B-Instruct-2507
    base_url: http://localhost:8001/v1
    api_key_env: LOCAL_LLM_API_KEY
    backend: local
    reasoning:
      enabled: false
    extra_body:
      temperature: 0.0
      max_tokens: 1024
  max_concurrent: 8

pairwise_slod:
  model:
    name: Qwen/Qwen3-30B-A3B-Instruct-2507
    base_url: http://localhost:8001/v1
    api_key_env: LOCAL_LLM_API_KEY
    backend: local
    reasoning:
      enabled: false
    extra_body:
      temperature: 0.0
      max_tokens: 256
  max_concurrent: 8
  extra_comparisons_per_problem: 10
  min_chunks: 2

failure_analysis:
  target_label: auto
  interp_points: 20
  cv_folds: 5
  random_state: 42
  top_k_features: 12
