# SH5a Configuration: Transition Matrix Analysis
# All hyperparameters and paths in one place

paths:
  data_sh5: data_sh5
  output_data: data
  results: data/results
  reports: reports
  figures: reports/figures

data_files:
  cot_slod_tags: data_sh5/cot_slod_tags.jsonl
  answer_scores: data_sh5/answer_scores.jsonl
  jump_metrics: data_sh5/jump_metrics.jsonl
  selected_questions: data_sh5/selected_questions.jsonl

slod_levels:
  - macro    # 0
  - meso     # 1
  - micro    # 2
n_levels: 3

conditions:
  - chunks_only
  - naive_hybrid
  - slod_weighted
  - slod_weighted_parent
routed_conditions:
  - slod_weighted
  - slod_weighted_parent
unrouted_conditions:
  - chunks_only
  - naive_hybrid

statistics:
  alpha: 0.05
  n_features: 30          # approximate number of features (hard + soft)
  n_targets: 2            # token_f1, attribution_f1
  n_comparisons: 60       # n_features * n_targets
  bonferroni_alpha: 0.000833  # alpha / n_comparisons
  min_effect_size: 0.10   # minimum |rho| for H1

clustering:
  k_range: [2, 3, 4]
  random_state: 42
  n_init: 10
  max_iter: 300
  metric: silhouette       # for selecting best k

logistic:
  regularization: l2
  C: 1.0
  random_state: 42
  cv_folds: 5
  max_iter: 1000

visualization:
  figure_dpi: 150
  figure_format: png
  colormap: RdBu_r
  heatmap_colormap: YlOrRd
