# SH2 Configuration: Activation Steering Along the SLoD Axis

project: SH2
title: "Activation Steering Along the SLoD Axis"

# --- Paths ---
data_dir: data
reports_dir: reports
figures_dir: reports/figures

# --- Input Data ---
sh0_spans: data/sh0/qasper_slod_length_matched.jsonl
sh1_embeddings: data/sh1/embeddings/scibert_length_matched.npz
sh1_splits: data/sh1/splits.json
sh5_questions: data/sh5/selected_questions.jsonl
sh5_answer_scores: data/sh5/answer_scores.jsonl
sh5_cot_tags: data/sh5/cot_slod_tags.jsonl

# --- Hardware ---
# GPU: NVIDIA L40S, 47.7 GB VRAM — no quantization needed; bfloat16 well-supported
hardware_note: "L40S 44.4GiB PyTorch-visible VRAM. Qwen2.5-14B-Instruct in 4-bit (~27GB loaded). Scale experiment vs Mistral-7B baseline. 72B/32B OOM during loading (transformers 5.x intermediate buffers)."

# --- Generative Model ---
# SH2b: Mistral-7B-Instruct-v0.3 (no quantization needed on L40S)
generative_model:
  name: mistralai/Mistral-7B-Instruct-v0.3
  quantization: null
  max_new_tokens: 512
  temperature: 0.0            # Deterministic generation
  batch_size: 4
  torch_dtype: bfloat16

# --- SciBERT (evaluation only) ---
scibert_model: allenai/scibert_scivocab_uncased
scibert_max_length: 512
scibert_batch_size: 32

# --- SLoD Axis (evaluation) ---
slod_axis:
  method: centroid            # centroid (primary) or lda (alternative)
  macro_label: 0
  meso_label: 1
  micro_label: 2

# --- Steering ---
steering:
  # Layer selection: try these fractions of total layers
  layer_fractions: [0.25, 0.50, 0.75]
  # Alpha (steering strength) sweep
  alpha_values: [0.1, 0.2, 0.3, 0.5, 0.8]
  # Directions
  directions: ["micro", "macro"]    # micro = +axis, macro = -axis
  # Validation subset for layer/alpha selection
  validation_n: 50
  # Span batch size for computing steering vectors (memory-dependent)
  span_batch_size: 32
  # Use only train split for steering vector computation
  use_train_split_only: true
  # SH2b: QA-context steering vector construction
  qa_vector_n: 100          # number of questions to use for vector construction
  qa_vector_split: first    # use first N questions for vector, rest for eval
  direction_flip: true    # SH2b: micro instruction -> macro SciBERT direction; flip here
  macro_instruction: "Answer briefly in one or two sentences at a high level, without specific technical details, numbers, or citations."
  micro_instruction: "Answer with full technical detail: include specific numbers, methods, experimental findings, and cite evidence where relevant."

# --- Answer Generation ---
generation:
  n_questions: 500
  prompt_template: |
    You are a scientific research assistant. Answer the following question based on the provided context.

    Context: {context}

    Question: {question}

    Answer concisely and accurately:
  # Use gold_evidence from selected_questions.jsonl as context
  context_source: gold_evidence

# --- Evaluation ---
evaluation:
  # SLoD shift
  shift_test: paired_t_test
  shift_threshold_d: 0.5       # Cohen's d for significance
  shift_threshold_p: 0.05
  # Surface metrics
  surface_metrics:
    - entity_density             # Capitalized multi-word spans per token
    - citation_density           # [N] or (Author, Year) patterns per token
    - numeric_density            # Numbers per token
    - mean_sentence_length       # Words per sentence
  surface_threshold_p: 0.05
  surface_min_significant: 2    # At least 2 of 4 must shift significantly
  # Factuality
  max_quality_drop: 0.05        # Max acceptable drop in token-F1 vs baseline

# --- Analysis ---
analysis:
  alpha: 0.05
  random_seed: 42

# --- Prior Baselines (from SH5 family) ---
baselines:
  sh5d_slod_axis_mean_rho: 0.219
  sh5d_slod_axis_auroc: 0.615
  sh5a_best_attr_f1_rho: -0.197
  sh1_probe_macro_f1: 0.72
  sh5d_cohens_d: 2.65           # SLoD axis separation in SciBERT space

# --- Exit Criteria ---
thresholds:
  h1_shift_d: 0.5              # Cohen's d for SLoD shift
  h1_shift_p: 0.05             # p-value for paired t-test
  h2_surface_p: 0.05           # p-value per surface metric
  h2_min_metrics: 2            # Minimum significant surface metrics
  h3_max_quality_drop: 0.05    # Max token-F1 drop vs baseline

# --- Summarization Experiment (SH2-summ) ---
summarization:
  n_construction: 100      # papers for steering vector construction
  n_validation: 50         # papers for layer/alpha selection
  min_spans: 15            # minimum spans per paper (filter)
  min_words: 500           # minimum word count per paper (filter)
  max_words: 4000          # maximum word count per paper (filter)
  max_source_tokens: 1024  # truncate paper text for model input
  alpha_values: [0.1, 0.2, 0.5, 1.0, 2.0]  # alpha sweep for summarization
  # Paths
  papers_path: data/summarization/papers.jsonl
  micro_references_path: data/summarization/micro_references.jsonl
  steering_vectors_path: data/summarization/steering_vectors.npz
  baseline_summaries_path: data/summarization/baseline_summaries.jsonl
  steered_summaries_path: data/summarization/steered_summaries.jsonl
  summaries_path: data/summarization/summaries.jsonl
  evaluation_results_path: data/summarization/evaluation_results.json
  # Prompt
  prompt_template: |
    You are a scientific research assistant. Read the following paper and provide a summary.

    Paper:
    {text}

    Summary:
  macro_instruction: "Write a single-sentence high-level summary. Do not include specific numbers, method names, or technical details."
  micro_instruction: "Write a detailed technical summary paragraph. Include specific numbers, method names, experimental results, and key findings."
  # H3 quality threshold (ROUGE-L drop vs baseline, both evaluated against micro reference spans)
  rouge_drop_threshold: 0.05
