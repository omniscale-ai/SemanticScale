[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semanticscale"]

[project]
name = "semanticscale"
version = "0.1.0"
description = "Experiments for Semantic Level of Detail in LLMs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=0.25.0",
    "choix>=0.4.1",
    "datasets>=2.16.0",
    "huggingface-hub>=0.20.0",
    "jsonlines>=4.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    "sentence-transformers>=5.3.0",
    "sentencepiece>=0.1.99",
    "spacy>=3.7.0",
    "tenacity>=8.0.0",
    "torch>=2.1.0",
    "tqdm>=4.66.0",
    "transformers>=4.36.0",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "PTH", "DTZ", "TRY", "FURB", "COM", "PLW", "PLC"]
ignore = [
    "COM812",    # conflicts with ruff formatter
    "TRY003",    # long exception messages
    "PLR0913",   # too many function arguments
    "PLC0415",   # allow deferred imports (e.g. heavy deps like matplotlib)
    "EXE001",    # shebang executable bit (handled outside Python)
]

[tool.ruff.lint.per-file-ignores]
"experiments/*/scripts/*.py" = ["TRY400"]  # scripts use logger.error deliberately

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
