[project]
name = "semanticscale"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=0.25.0",
    "datasets>=2.16.0",
    "huggingface-hub>=0.20.0",
    "jsonlines>=4.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    "sentence-transformers>=5.3.0",
    "sentencepiece>=0.1.99",
    "spacy>=3.7.0",
    "torch>=2.1.0",
    "tqdm>=4.66.0",
    "transformers>=4.36.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
