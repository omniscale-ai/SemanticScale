[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semanticscale"]

[project]
name = "semanticscale"
version = "0.1.0"
description = "Experiments for Semantic Level of Detail in LLMs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aeon>=1.4.0",
    # Stage-5 model-comparison track (analysis-only). Heavy deps used by
    # Stage 1 (trace generation) and Stage 2 (pairwise SLoD judging) are
    # commented out: those stages produce cached JSONL/CSV artifacts that
    # the analysis stages read directly. Restore the commented lines (and
    # the [tool.uv.sources] vllm entry) before re-running Stages 1-2.
    # "accelerate>=0.25.0",
    "choix>=0.4.1",
    # "datasets>=2.16.0",
    # "huggingface-hub>=0.20.0",
    "gdown>=6.0.0",
    "jsonlines>=4.0.0",
    "lightgbm>=4.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "openrouter>=0.9.1",
    "openskill>=6.2.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0",
    # "safetensors>=0.4.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.0",
    # "sentence-transformers>=5.3.0",
    # "sentencepiece>=0.1.99",
    # "spacy>=3.7.0",
    "tabulate>=0.10.0",
    "tenacity>=8.0.0",
    "tqdm>=4.66.0",
    # "transformers>=4.36.0",
    # "torch==2.11.0",
    # "vllm==0.20.0",
    # "nixl-cu13>=1.0.1",
    "umap-learn>=0.5.12",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "PTH", "DTZ", "TRY", "FURB", "COM", "PLW", "PLC"]
ignore = [
    "COM812",    # conflicts with ruff formatter
    "TRY003",    # long exception messages
    "PLR0913",   # too many function arguments
    "PLC0415",   # allow deferred imports (e.g. heavy deps like matplotlib)
    "EXE001",    # shebang executable bit (handled outside Python)
]

[tool.ruff.lint.per-file-ignores]
"experiments/*/scripts/*.py" = ["TRY400"]  # scripts use logger.error deliberately

# Restore when re-enabling vllm in [project.dependencies]:
# [tool.uv.sources]
# vllm = { path = "../../../mnt/hdd/torch_wheels/vllm-0.20.0+cu132-cp312-cp312-linux_x86_64.whl" }

[tool.uv]
environments = ["python_full_version == '3.12.*' and sys_platform == 'linux'"]
